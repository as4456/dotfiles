# Managed by chezmoi.

# ---------------------------------------------------------------- terminal
# NOT "alacritty": that terminfo entry is not present on a base Ubuntu install, and
# tmux refuses to start when default-terminal has no entry. It also hardcoded one
# emulator into a file that should not care which one is attached.
set -g default-terminal "tmux-256color"

# Advertise 24-bit colour to programs inside tmux. Without this, nvim sets
# termguicolors but tmux never passes RGB through, so the colourscheme silently
# degrades to 256 colours. Requires tmux 3.2+; 3.4 is installed.
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

# Without this, Esc leaving insert mode in nvim lags by up to half a second.
set -sg escape-time 10

# nvim's autoread and gitsigns' refresh-on-focus both need focus events.
set -g focus-events on

set -g history-limit 50000
set -g display-time 2000

# ---------------------------------------------------------------- prefix
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ---------------------------------------------------------------- panes
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Repeatable resize: hold the key without re-pressing the prefix.
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind m resize-pane -Z

bind C-p previous-window
bind C-n next-window

# New windows inherit the current directory.
bind c new-window -c "#{pane_current_path}"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------------- copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Copy to the SYSTEM clipboard, not just tmux's own buffer. Resolved at runtime so the
# same line works under WSL (clip.exe), macOS (pbcopy) and X11 (xclip).
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel \
  'if command -v clip.exe >/dev/null 2>&1; then clip.exe; \
   elif command -v pbcopy >/dev/null 2>&1; then pbcopy; \
   elif command -v wl-copy >/dev/null 2>&1; then wl-copy; \
   else xclip -selection clipboard; fi'

# Keep a mouse selection visible after the button is released.
unbind -T copy-mode-vi MouseDragEnd1Pane

set-option -g status-position top

# ---------------------------------------------------------------- catppuccin
# These are the v0.3.x option names. catppuccin/tmux v2 renamed every one of them, so
# the plugin is pinned below to keep them meaningful. Migrating to the v2 API is a
# separate job.
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator "  █"

set -g @catppuccin_window_default_fill "number"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#{pane_current_path}"

set -g @catppuccin_status_modules_right "directory session date_time weather"
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "yes"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "no"

# ---------------------------------------------------------------- plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v0.3.0'
# Fetches from an external API on every status refresh.
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# tpm must be cloned here first:
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# then press prefix + I inside tmux to install the rest.
run '~/.config/tmux/plugins/tpm/tpm'
